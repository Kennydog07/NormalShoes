# Normal Shoes films. Static site built by build.js (no framework).
[build]
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---- API -----------------------------------------------------------------
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/stock/:release"
  to = "/.netlify/functions/stock/:release"
  status = 200

# ---- Old service-site URLs -> the label (301) ----------------------------
